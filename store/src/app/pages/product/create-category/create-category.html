<nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center">
                <span class="text-2xl font-bold text-purple-600">🛒 Admin - Tienda Online</span>
            </div>
            <div class="flex items-center space-x-8">
                <a class="text-gray-700 hover:text-purple-600 font-medium transition-colors cursor-pointer" (click)="goToRouter('/')">Inicio</a>
                <a class="text-gray-700 hover:text-purple-600 font-medium transition-colors cursor-pointer" (click)="goToRouter('/product')">Productos</a>
                <a class="text-purple-600 font-medium cursor-pointer" (click)="goToRouter('/register-category')">Categorías</a>
                <button class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-6 py-2 rounded-full font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300">
                    Salir
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="bg-gradient-to-r from-purple-600 to-indigo-700 text-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold mb-4">Gestión de Categorías</h1>
        <p class="text-xl opacity-90">Crea y administra las categorías de tu tienda</p>
    </div>
</div>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-md p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Agregar Nueva Categoría</h2>
                
                <form class="space-y-6">
                    <div>
                        <label for="nombreCategoria" class="block text-sm font-medium text-gray-700 mb-2">
                            Nombre de la Categoría *
                        </label>
                        <input 
                            type="text" 
                            id="nombreCategoria" 
                            name="nombreCategoria"
                            placeholder="Ej: Electrónica, Ropa, Hogar..."
                            required
                            class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent transition-all outline-none"
                        >
                    </div>

                    <div>
                        <label for="emoji" class="block text-sm font-medium text-gray-700 mb-2">
                            Emoji/Icono *
                        </label>
                        <input 
                            type="text" 
                            id="emoji" 
                            name="emoji"
                            placeholder="Ej: 📱"
                            maxlength="2"
                            required
                            class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent transition-all outline-none text-5xl text-center"
                        >
                        <p class="text-xs text-gray-500 mt-1">Selecciona un emoji que represente la categoría</p>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 pt-4">
                        <button 
                            type="button"
                            class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300"
                            (click)="saveChanges()"
                        >
                            ✓ Guardar Categoría
                        </button>
                        <button 
                            type="reset"
                            class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-colors"
                            (click)="goToRouter('/')"
                        >
                            ✕ Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl shadow-md p-6 sticky top-24">
                <h2 class="text-xl font-bold text-gray-800 mb-6">Categorías Existentes</h2>
                
                <div class="space-y-3 max-h-[600px] overflow-y-auto">
                    <div class="group relative p-4 bg-gray-50 rounded-lg border border-gray-200"
                        *ngFor="let category of categories">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">{{category.emoji}}</span>
                                <div>
                                    <p class="font-semibold text-gray-800">{{category.nombre}}</p>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-2 mt-3">
                            <button class="flex-1 px-3 py-1.5 bg-white text-purple-600 text-sm font-medium rounded hover:bg-purple-50 transition-colors"
                                (click)="getCategoryById(category.id)">
                                ✏️ Editar
                            </button>
                            <button class="flex-1 px-3 py-1.5 bg-white text-red-600 text-sm font-medium rounded hover:bg-red-50 transition-colors"
                                (click)="deleteCategory(category.id)">
                                🗑️ Eliminar
                            </button>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>

    </div>
</div>
